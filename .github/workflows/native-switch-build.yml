name: Native Switch build

on:
  push:
    branches:
      - deko3d-native-runtime-test
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Bootstrap container tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates cmake ninja-build python3

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Checkout submodules
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule sync --recursive >/dev/null
          while read -r _ path; do
            log_file="/tmp/submodule-$(echo "$path" | tr '/' '_').log"
            if ! git submodule update --init --recursive --depth 1 -- "$path" >"$log_file" 2>&1; then
              echo "FAILED_SUBMODULE=$path"
              cat "$log_file"
              exit 1
            fi
          done < <(git config --file .gitmodules --get-regexp '^submodule\..*\.path$')

      - name: Install Switch build tools
        shell: bash
        run: |
          dkp-pacman -Syu --noconfirm --needed \
            switch-dev switch-cmake switch-tools deko3d

      - name: Configure
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          cmake -S . -B build-switch -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SWITCH_FRONTEND=ON \
            -DENABLE_QT=OFF \
            -DENABLE_OPENGL=OFF \
            -DENABLE_VULKAN=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -DENABLE_SCRIPTING=OFF \
            -DENABLE_GDBSTUB=OFF \
            -DENABLE_TESTS=OFF \
            -DCITRA_USE_PRECOMPILED_HEADERS=OFF \
            -DENABLE_LTO=OFF \
            -DAZAHAR_DEKO3D_VALIDATION=ON \
            -DCMAKE_PROJECT_INCLUDE=$GITHUB_WORKSPACE/native_runtime/NativeRuntimeFinal.cmake

      - name: Build NRO
        shell: bash
        run: cmake --build build-switch --target azahar_switch -j2

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: azahar-native-switch
          path: |
            build-switch/bin/Release/azahar.nro
            build-switch/bin/Release/azahar_switch.elf
          if-no-files-found: error
