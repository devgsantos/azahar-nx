name: Switch performance branch build

on:
  push:
    branches:
      - feat/gpt-performance-improvements-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: switch-performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Trust container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout pinned submodules
        id: submodules
        continue-on-error: true
        run: |
          set +e
          git submodule sync > /tmp/submodules.log 2>&1
          git -c protocol.version=2 submodule update --init --jobs 4 \
            >> /tmp/submodules.log 2>&1
          status=$?

          # Azahar already pins the compatible top-level Oaknut checkout. Dynarmic's nested Oaknut
          # gitlink is intentionally not followed; only its additional required dependencies are
          # initialized. This keeps the build tied to exact Azahar gitlinks instead of floating main.
          if [ "$status" -eq 0 ]; then
            git -C externals/dynarmic submodule sync >> /tmp/submodules.log 2>&1
            git -C externals/dynarmic -c protocol.version=2 submodule update --init \
              externals/mcl externals/robin-map >> /tmp/submodules.log 2>&1
            status=$?
          fi

          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Upload submodule checkout log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: switch-submodule-checkout-log
          path: /tmp/submodules.log
          if-no-files-found: warn

      - name: Stop on submodule checkout failure
        if: steps.submodules.outcome == 'failure'
        run: exit 1

      - name: Configure and build release NRO
        env:
          DEVKITPRO: /opt/devkitpro
          BUILD_TYPE: Release
          JOBS: 2
          DEKO3D_VALIDATION: OFF
          DEKO3D_VERBOSE_TELEMETRY: OFF
          SWITCH_PERF_DIAGNOSTICS: OFF
          SWITCH_TRACE_ENABLED: OFF
          JIT_PARTIAL_PUBLISH: ON
        run: ./build-switch.sh

      - name: Upload Switch binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: azahar-switch-performance-v1
          path: |
            build-switch/bin/Release/azahar.nro
            build-switch/bin/Release/azahar_switch.elf
          if-no-files-found: error
